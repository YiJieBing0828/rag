# RAG 知识库站点：通过 IP 直接访问，nginx 反代到 uvicorn 127.0.0.1:8100
# 该文件由部署流程拷贝到 /www/server/panel/vhost/nginx/rag-kb.conf

server {
    listen 80;
    server_name your-server-ip;

    root /www/wwwroot/rag-kb/frontend/dist;
    index index.html;

    # 与 UPLOAD_MAX_SIZE_MB=50 对齐，额外给 14M 余量给 multipart 头
    client_max_body_size 64m;

    access_log /www/wwwlogs/rag-kb.log;
    error_log /www/wwwlogs/rag-kb.error.log;

    # 后端 + SSE
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关 buffering/缓存，长连接超时拉长，启用 chunked
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA：未匹配的路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
