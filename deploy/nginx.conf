# RAG 知识库站点：通过 IP 直接访问，nginx 反代到 uvicorn 127.0.0.1:8100
# 该文件由部署流程拷贝到 /www/server/panel/vhost/nginx/rag-kb.conf

server {
    listen 80;
    server_name your-server-ip;

    root /www/wwwroot/rag-kb/frontend/dist;
    index index.html;

    # 与 UPLOAD_MAX_SIZE_MB=50 对齐，额外给 14M 余量给 multipart 头
    client_max_body_size 64m;

    access_log /www/wwwlogs/rag-kb.log;
    error_log /www/wwwlogs/rag-kb.error.log;

    # 后端 + SSE
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # 本文件默认监听 80，此时 $host 与 $http_host 等价；若改到非 80 端口，
        # 这里要和下面 /mcp 一样换成 $http_host，否则端口丢失会导致 502
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关 buffering/缓存，长连接超时拉长，启用 chunked
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # MCP Server（第 13 期起挂在 /mcp，不在 /api/ 下）⇒ 必须单独反代。
    # 漏掉这段不会报错：/mcp 会被下面的 SPA 兜底吃掉，返回 200 + text/html，
    # 状态码正常所以最难查——MCP 客户端只会说「握手失败」。
    location /mcp {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # 必须用 $http_host：$host 只带主机名会丢端口，MCP 客户端按 Host 拼 URL，
        # 非 80 端口部署时会拼到无端口的地址上，实测表现为 502
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP 同样是长连接/事件流，SSE 三件套照配
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA：未匹配的路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
